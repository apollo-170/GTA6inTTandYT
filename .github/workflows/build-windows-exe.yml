name: ClipForge Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out ClipForge
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Include FFmpeg in the Windows EXE installer
        shell: pwsh
        run: .\scripts\prepare-ffmpeg.ps1

      - name: Compile Windows application and EXE installer
        run: npm run build:desktop

      - name: Assemble portable application ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable\resources -Force | Out-Null
          Copy-Item src-tauri\target\release\clipforge.exe portable\ClipForge.exe
          Copy-Item src-tauri\resources\ffmpeg.exe portable\resources\ffmpeg.exe
          Copy-Item src-tauri\resources\FFMPEG-NOTICE.txt portable\resources\FFMPEG-NOTICE.txt
          Compress-Archive -Path portable\* -DestinationPath ClipForge-Windows-portable.zip -Force

      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-Installer-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-Portable
          path: ClipForge-Windows-portable.zip
          if-no-files-found: error

      - name: Publish ClipForge v0.3.0 release
        if: "github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: ClipForge v0.3.0')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: main
          name: ClipForge v0.3.0 — Windows
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            ClipForge-Windows-portable.zip
          body: |
            ## ClipForge v0.3.0 — Windows Preview
            New dark dashboard, revamped streamer cards, AI event timeline, channel search, and clip-status filters.

            **Windows x64:** Download the `.exe` installer from Assets and run it. A portable build is also attached as a ZIP.

            **Important:** Preview release. Twitch authentication and access rights are required for live events and authorized clips. Continuous live vision/audio detection, integrated YouTube/TikTok OAuth, and fully unattended TikTok posting are not implemented. The software is not production-ready. Use only footage you are allowed to reuse.
