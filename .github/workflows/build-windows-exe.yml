name: ClipForge Windows EXE

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Обновить Windows EXE в релизе v0.4.2 после настройки OAuth Client IDs'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CLIPFORGE_TWITCH_CLIENT_ID: ${{ vars.CLIPFORGE_TWITCH_CLIENT_ID || 'uke7rmobt4elpl5va4in7wskxzrl86' }}
  CLIPFORGE_YOUTUBE_CLIENT_ID: ${{ vars.CLIPFORGE_YOUTUBE_CLIENT_ID || '626827430390-hs0in9d6urln2ub5hvvmk3g59chn4cdi.apps.googleusercontent.com' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out ClipForge
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate public OAuth client IDs
        shell: pwsh
        run: |
          if ($env:CLIPFORGE_TWITCH_CLIENT_ID -notmatch '^[a-z0-9]{30}
        shell: pwsh
        run: |
          if (-not $env:CLIPFORGE_TWITCH_CLIENT_ID) { Write-Warning "Twitch Client ID is missing. Sign in will be unavailable until the owner configures it." }
          if (-not $env:CLIPFORGE_YOUTUBE_CLIENT_ID) { Write-Warning "YouTube OAuth Client ID is missing. Sign in will be unavailable until the owner configures it." }
          Write-Host "Public Client IDs checked. OAuth client secrets are not embedded."

      - name: Require OAuth IDs when publishing configured EXE manually
        if: "github.event_name == 'workflow_dispatch' && inputs.publish_release"
        shell: pwsh
        run: |
          if (-not $env:CLIPFORGE_TWITCH_CLIENT_ID) { throw "Set CLIPFORGE_TWITCH_CLIENT_ID in GitHub Actions Variables." }
          if (-not $env:CLIPFORGE_YOUTUBE_CLIENT_ID) { throw "Set CLIPFORGE_YOUTUBE_CLIENT_ID in GitHub Actions Variables." }

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Check frontend TypeScript compilation
        run: npm run build

      - name: Include FFmpeg in the Windows EXE installer
        shell: pwsh
        run: .\scripts\prepare-ffmpeg.ps1

      - name: Compile Windows application and EXE installer
        run: npm run build:desktop

      - name: Assemble portable application ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable\resources -Force | Out-Null
          Copy-Item src-tauri\target\release\clipforge.exe portable\ClipForge.exe
          Copy-Item src-tauri\resources\ffmpeg.exe portable\resources\ffmpeg.exe
          Copy-Item src-tauri\resources\FFMPEG-NOTICE.txt portable\resources\FFMPEG-NOTICE.txt
          Compress-Archive -Path portable\* -DestinationPath ClipForge-Windows-portable.zip -Force

      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-Installer-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-Portable
          path: ClipForge-Windows-portable.zip
          if-no-files-found: error

      - name: Publish ClipForge v0.4.2 release
        if: "github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'release: ClipForge v0.4.2') || (github.event_name == 'workflow_dispatch' && inputs.publish_release))"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2
          target_commitish: main
          name: ClipForge v0.4.2 — Windows
          draft: false
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            ClipForge-Windows-portable.zip
          body: |
            ## ClipForge v0.4.2 — Windows Preview
            Adds in-app provider diagnostics, checks for required OAuth build IDs, improves Twitch login by automatically leaving demo mode, retains safe YouTube PKCE sign-in and release update checking.

            **Windows x64:** Download the `.exe` installer from Assets and run it. A portable build is also attached as a ZIP.

            **Important:** Preview release. Twitch authentication and access rights are required for live events and authorized clips. Continuous live vision/audio detection and fully unattended TikTok posting are not implemented. YouTube sign-in requires the application owner's Google OAuth Client ID; TikTok requires an approved server-side integration. The software is not production-ready. Use only footage you are allowed to reuse.
) { throw "Twitch Client ID format invalid." }
          if ($env:CLIPFORGE_YOUTUBE_CLIENT_ID -notmatch '^\d+-[a-z0-9]+\.apps\.googleusercontent\.com
        shell: pwsh
        run: |
          if (-not $env:CLIPFORGE_TWITCH_CLIENT_ID) { Write-Warning "Twitch Client ID is missing. Sign in will be unavailable until the owner configures it." }
          if (-not $env:CLIPFORGE_YOUTUBE_CLIENT_ID) { Write-Warning "YouTube OAuth Client ID is missing. Sign in will be unavailable until the owner configures it." }
