name: ClipForge Windows EXE

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Пересобрать Windows EXE и обновить релиз v0.8.0'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CLIPFORGE_TWITCH_CLIENT_ID: ${{ vars.CLIPFORGE_TWITCH_CLIENT_ID || 'uke7rmobt4elpl5va4in7wskxzrl86' }}
  CLIPFORGE_YOUTUBE_CLIENT_ID: ${{ vars.CLIPFORGE_YOUTUBE_CLIENT_ID || '626827430390-hs0in9d6urln2ub5hvvmk3g59chn4cdi.apps.googleusercontent.com' }}
  CLIPFORGE_TIKTOK_BRIDGE_URL: ${{ vars.CLIPFORGE_TIKTOK_BRIDGE_URL }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out ClipForge
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate public OAuth Client ID formats
        shell: pwsh
        run: |
          if ($env:CLIPFORGE_TWITCH_CLIENT_ID -notmatch '^[a-z0-9]{30}$') { throw 'Twitch Client ID format invalid' }
          if ($env:CLIPFORGE_YOUTUBE_CLIENT_ID -notmatch '^\d+-[a-z0-9]+\.apps\.googleusercontent\.com$') { throw 'Google OAuth Client ID format invalid' }
          Write-Host 'Public OAuth identifier formats checked; actual provider authorization requires live account verification.'

      - name: Verify developer OAuth configuration
        shell: pwsh
        run: |
          if (-not $env:CLIPFORGE_TWITCH_CLIENT_ID) { Write-Warning "Twitch Client ID is missing. Sign in will be unavailable until the owner configures it." }
          if (-not $env:CLIPFORGE_YOUTUBE_CLIENT_ID) { Write-Warning "YouTube OAuth Client ID is missing. Sign in will be unavailable until the owner configures it." }
          Write-Host "Public Client IDs checked. OAuth client secrets are not embedded."

      - name: Require OAuth IDs when publishing configured EXE manually
        if: "github.event_name == 'workflow_dispatch' && inputs.publish_release"
        shell: pwsh
        run: |
          if (-not $env:CLIPFORGE_TWITCH_CLIENT_ID) { throw "Set CLIPFORGE_TWITCH_CLIENT_ID in GitHub Actions Variables." }
          if (-not $env:CLIPFORGE_YOUTUBE_CLIENT_ID) { throw "Set CLIPFORGE_YOUTUBE_CLIENT_ID in GitHub Actions Variables." }

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate optional TikTok OAuth bridge source
        run: node --check tiktok-bridge/server.mjs

      - name: Check frontend TypeScript compilation
        run: npm run build

      - name: Include FFmpeg in the Windows EXE installer
        shell: pwsh
        run: .\scripts\prepare-ffmpeg.ps1

      - name: Compile Windows application and EXE installer
        run: npm run build:desktop

      - name: Assemble portable application ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable\resources -Force | Out-Null
          Copy-Item src-tauri\target\release\clipforge.exe portable\ClipForge.exe
          Copy-Item src-tauri\resources\ffmpeg.exe portable\resources\ffmpeg.exe
          Copy-Item src-tauri\resources\FFMPEG-NOTICE.txt portable\resources\FFMPEG-NOTICE.txt
          Compress-Archive -Path portable\* -DestinationPath ClipForge-Windows-portable.zip -Force

      - name: Generate Windows EXE checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows EXE not found" }
          $sha = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($installer.Name)" | Set-Content -Path "ClipForge-Windows-Installer-SHA256.txt" -Encoding ascii
          Write-Host "Installer SHA256 generated"

      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-Installer-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-Portable
          path: ClipForge-Windows-portable.zip
          if-no-files-found: error

      - name: Publish ClipForge v0.8.0 release
        if: "github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'release: ClipForge v0.8.0') || (github.event_name == 'workflow_dispatch' && inputs.publish_release))"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0
          target_commitish: main
          name: ClipForge v0.8.0 — Windows
          draft: false
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            ClipForge-Windows-portable.zip
            ClipForge-Windows-Installer-SHA256.txt
          body: |
            ## ClipForge v0.8.0 — Windows Preview
            Official TikTok multi-account desktop integration: OAuth PKCE on 127.0.0.1, Client Key and Secret supplied and protected locally in Windows Credential Manager, per-account token refresh and native Content Posting API upload. Direct Post uses creator-info privacy checks and publish-status polling; Upload to Inbox drafts is available where authorized. Automatic TikTok background uploads send to Inbox drafts only; public Direct Post requires an explicit per-video confirmation, creator-specific audience selection, appropriate API scopes and app audit. Free YouTube auto-upload and local monitoring are unchanged. TikTok public visibility requires the app owner to obtain appropriate TikTok API permissions and pass the platform audit; there is no age-check or abuse-control bypass. No Upload-Post subscription is required. Private GitHub release OTA remains supported.

            **Windows x64:** Download the `.exe` installer from Assets and run it. A portable build is also attached as a ZIP.

            **Important:** Preview release. TikTok requires the user's own approved Developer app with Desktop Login Kit and Content Posting API. Register the exact redirect URI http://127.0.0.1:34865/callback/. Unreviewed apps are limited to private TikTok Direct Posts, and video.publish access must be approved. A personal developer Client Secret is stored in Windows Credential Manager on the user's own computer; this is for personal use, not a hosted multiuser service. TikTok may require authorization or consent for each post; follow TikTok's publishing guidelines. TikTok or YouTube public uploading has NOT been tested with live accounts. Twitch authentication and clip rights are required. Only use footage you have rights to publish.
